idata a la Alcaldía. No se halló nota que diga qué pasó con su precandidatura (puede competir por otra dignidad, por ejemplo una concejalía, o haber salido de la carrera). El dato de ADN tiene unos tres meses y conviene tratarlo como dudoso hasta ver la lista del CNE.", "pendiente": "Comprobar en la lista del CNE (9-nov-2026) o en Voto Informado si Baque está inscrita en alguna dignidad por ADN. Si no lo está, valorar rotular la entrada como precandidata (jul-2026) o dejarla sin afiliación.", "duplicado": null, "consultas": ["\"Lorena Baque\" ADN alcaldía Santo Domingo candidata (solo devolvió resultados de República Dominicana)", "Yadira Bayas candidata alcaldía Santo Domingo ADN Lorena Baque prefectura cambio candidatura", "Lectura de la etiqueta lorena-baque de El Diario y de su nota del 29-jul-2026", "Lectura de Expreso (11-ago-2026) y de El Diario (11 y 14-ago-2026) sobre Erazo y Bayas"], "avisos": [], "ejemplos": [{"fecha": "2026-10-23", "texto": "Hoy, en Santa Martha, este terreno está vacío. Pero donde algunos ven tierra sin uso, la comunidad puede imaginar un espacio lleno de movimiento. 🌳⚽ La propuesta es darle una nueva función: crear un parque donde niños y jóvenes puedan correr, jugar, entrenar y compartir; donde las familias tengan un lugar seguro para e…", "enlace": "https://www.facebook.com/ads/library/?id=2457844448355836"}, {"fecha": "2026-07-06", "texto": "Hoy asumo con humildad y con fuerza la precandidatura a la Alcaldía. Mi propuesta es clara: Humanización y Territorio. Mas obras pensando en la gente con un solo propósito el bienestar de mi Santo Domingo. #DraLorenaBaque #Precandidatura #Humanizacion #YadiraBayas #SantoDomingo #MujeresQueLideran", "enlace": "https://www.facebook.com/ads/library/?id=3972966086330498"}], "notas_previas": ""}, {"clave": "B37", "nombre": "Jaime Guevara", "origen": "sin_registro", "page_ids": ["107526082366348"], "etiqueta": "97 anuncios · USD 4.902 · Pastaza 92%, Tungurahua 2%", "pagador": false, "paginas_que_paga" ": "https://elyex.com/candidatos-a-la-prefectura-de-pichincha/", "medio": "El Yex (medio regional)", "fecha": "2026-08-25", "tipo_fuente": "prensa", "afirma": "Lo presenta como candidato del PSP, abogado y exasambleísta; dice que en 2025 fue candidato de Construye y que lidera el colectivo Quiteño Libre."}], "adicionales": {"candidatura_2026": "Prefecto de Pichincha", "lista": "3 (Partido Sociedad Patriótica)", "jurisdiccion": "Provincia de Pichincha", "estado_candidatura": "Inscrito (cierre de inscripciones 2026-08-17); calificado según KCH (2026-09-07) y Primicias (2026-09-28, «casi asegurado»); Primicias (2026-10-26) da por resuelta la prefectura de Pichincha. Falta cotejar con la lista oficial del CNE (9-nov-2026)."}, "vinculos": [], "datos_meta": "Página «Apoyo a Jorge Pinto» (page_id 1309069735626607): 7 anuncios entre 2026-10-13 y 2026-10-20, gasto medio declarado 346 USD, alcance Pichincha 99 %, todos pagados por «Web Plus Solutions» (A10). El texto de ejemplo está en primera persona («Soy abogado»), hashtag #DeLaQuejaALaObra. Se usó solo para identificar, no como prueba de afiliación.", "dudas": "1) Ninguna fuente externa confirma que la página de Meta sea del candidato o de su campaña. 2) Apellido escrito «Dávila» (El Comercio, KCH) y «Daila» (Teleamazonas, otra nota de KCH): comprobar en el CNE. 3) El Yex (medio menor, sin segunda fuente) atribuye trayectoria previa en CREO (2021) y Construye (2025): sería un cambio de partido, no confirmado. 4) Al 2026-11-06 no hay lista definitiva del CNE.", "pendiente": "Cotejar con la lista oficial del CNE (9-nov-2026) o «Voto Informado» que Jorge Pinto (PSP, lista 3) sigue en la papeleta. Con sesión, revisar si la página «Apoyo a Jorge Pinto» enlaza a la campaña o al perfil del candidato. Decidir qué hacer con el pagador Web Plus Solutions (A10).", "duplicado": null, "consultas": ["Jorge Pinto candidato alcaldía de Quito 2026 movimiento", "\"Jorge Pinto\" prefectura de Pichincha Sociedad Patriótica candidato", "\"Jorge Pinto\" Sociedad Patriótica prefecto Pichincha abogado quién es candidato", "Jorge Pinto exasambleísta Quiteño Libre candidato Prefectura de Pichincha Sociedad Patriótica", "\"De la queja a la obra\" Jorge Pinto Pichincha (sin resultados útiles)", "Jorge Pinto Dávila Sociedad Patriótica prefectura Pichincha Gutiérrez propuesta campaña", "\"Jorge Pinto\" candidato a prefecto de Pichincha entrevista propuestas PSP", "Jorge Pinto asambleísta Pichincha CREO abogado 2021 Quito sur"], "avisos": [], "ejemplos": [{"fecha": "2026-10-20", "texto": "Quién es Jorge Pinto. Nací y crecí en el sur de Quito. Soy abogado, esposo y padre de tres hijos. Esta es mi historia. #DeLaQuejaALaObra", "enlace": "https://www.facebook.com/ads/library/?id=1856983275922488"}], "notas_previas": ""}, {"clave": "B44", "nombre": "Amigos De John Vinueza", "origen": "sin_registro", "page_ids": ["2174951136066727"], "etiqueta": "66 anuncios · USD 4.367 · Chimborazo 69%, Tungurahua 14%", "pagador": false, "paginas_que_paga": [], "pagadores": ["Amigos De John Vinueza"], "resultado": "parcial", "confianza": "media", "motivo": "Candidatura y lista de John Vinueza respaldadas por dos diarios locales (21 y 24-oct-2026) que citan el listado en firme de la Delegación Provincial Electoral de Chimborazo del CNE, y por tres notas de agosto. No es alta porque no se vio el listado oficial del CNE y porque el vínculo entre la página «Amigos De John Vinueza» y su campaña se deduce solo del nombre y del contenido de los anuncios.", "quien_es": "Página de Facebook (ID 2174951136066727) que, por su nombre y por sus anuncios (hashtags #JohnVinueza #DaleJohnDale), apoya a John Henry Vinueza Salinas, alcalde de Riobamba (Chimborazo) y candidato a la reelección en las seccionales del 29-nov-2026 por la lista 1-21 «Cuidamos de la Gente». Ninguna fuente independiente documenta quién administra la página ni que sea la de su campaña.", "tipo": "candidato", "partido": "Cuidamos de la Gente", "afiliacion": "Apoya a John Vinueza, candidato a la reelección en la Alcaldía de Riobamba por «Cuidamos de la Gente» (lista 1-21)", "fuente": "https://diariolosandes.com.ec/nueve-candidaturas-en-firme-para-la-alcaldia-de-riobamba/", "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https://diariolosandes.com.ec/nueve-candidaturas-en-firme-para-la-alcaldia-de-riobamba/", "medio": "Diario Los Andes (Riobamba)", "fecha": "2026-10-24", "tipo_fuente": "prensa", "afirma": "Candidaturas en firme según la delegación del CNE en Chimborazo: John Vinueza, alcalde actual, participa por la lista 1-21, Cuidamos de la Gente."}, {"url": "https://laprensa.com.ec/los-candidatos-inscritos-a-la-alcaldia-de-riobamba/", "medio": "La Prensa (Riobamba)", "fecha": "2026-10-21", "tipo_fuente": "prensa", "afirma": "Nueve candidatos en firme (delegación CNE Chimborazo); John Henry Vinueza Salinas, alcalde actual, por Cuidamos de la Gente, lista 1-21, para 2027-2031."}, {"url": "https://diariolosandes.com.ec/john-vinueza-cree-en-una-posible-reeleccion-en-riobamba/", "medio": "Diario Los Andes (Riobamba)", "fecha": "2026-08-11", "tipo_fuente": "prensa", "afirma": "Buscará la reelección bajo el auspicio de Centro Democrático, lista 1; la inscripción contrasta con declaraciones previas de que no repetiría. Fecha según la página."}, {"url": "https://centrotvecuador.com/2026/08/11/john-vinueza-inscribe-su-candidatura-con-centro-democratico-para-buscar-la-reeleccion-a-la-alcaldia-de-riobamba-tras-haber-descartado-un-nuevo-periodo/", "medio": "Centro TV Ecuador", "fecha": "2026-08-11", "tipo_fuente": "prensa", "afirma": "Inscribe su candidatura a la reelección con el auspicio político de Centro Democrático, lista 1; antes había dicho que no buscaría un segundo período."}, {"url": "https://riobamba.co/candidato-john-vinueza-busca-nuevo-mandato-en-riobamba/", "medio": "El Riobambeño", "fecha": "2026-08-11", "tipo_fuente": "prensa", "afirma": "Confirma la inscripción de su candidatura a la reelección en un acto público; no menciona organización ni lista ni si fue calificada."}, {"url": "https://www.laprensa.com.ec/elecciones-alcaldes-ecuador-2027-vinueza/", "medio": "La Prensa (Riobamba)", "fecha": "2026-01-25", "tipo_fuente": "prensa", "afirma": "Llegó al cargo bajo la organización Reto, lista 33, cuyo respaldo orgánico no ha sido visible; entonces decía que no buscaría la reelección. Superada por la inscripción de agosto."}, {"url": "https://www.diariolosandes.com.ec/11-candidatos-para-la-alcaldia-de-riobamba/", "medio": "Diario Los Andes (Riobamba)", "fecha": "2022-10-04", "tipo_fuente": "prensa", "afirma": "Para las seccionales de 2023 fue candidato por la alianza «Vecinos en Acción»: Centro Democrático (lista 1) y Reto (lista 33). Fuente de más de un año."}], "adicionales": {"cargo_actual": "Alcalde de Riobamba (en funciones; el periodo actual termina en 2027)", "candidatura_2026": "Reelección, Alcaldía de Riobamba (periodo 2027-2031)", "lista": "1-21 Cuidamos de la Gente", "jurisdiccion": "Cantón Riobamba, Chimborazo", "estado_candidatura": "En firme según el listado de la Delegación Provincial Electoral de Chimborazo del CNE (notas del 21 y 24-oct-2026); sin contrastar con la lista oficial del CNE esperada para el 9-nov-2026"}, "vinculos": [{"descripcion": "En 2023 compitió por la alianza «Vecinos en Acción» (Centro Democrático, lista 1, y Reto, lista 33); confirma la pista de la revisión anterior.", "fuente": "https://www.diariolosandes.com.ec/11-candidatos-para-la-alcaldia-de-riobamba/", "fecha": "2022-10-04"}, {"descripcion": "En enero de 2026 se informó que llegó al cargo bajo Reto (lista 33) y que decía no buscar la reelección; en agosto de 2026 se inscribió con Centro Democrático (lista 1).", "fuente": "https://www.laprensa.com.ec/elecciones-alcaldes-ecuador-2027-vinueza/", "fecha": "2026-01-25"}], "datos_meta": "66 anuncios entre 2026-07-13 y 2026-11-04; gasto medio del expediente aprox. USD 4 367; el pagador declarado es el propio nombre de la página (66 anuncios). Alcance: Chimborazo 69 %, Tungurahua 14 %, Bolívar 6 %, Los Ríos 4 %. Los textos de ejemplo (oct-nov 2026) hablan en primera persona plural de obras y proyectos municipales de Riobamba (agua en Maguazo/Alao, el tren de Riobamba, la Loma de Quito) y usan los hashtags #JohnVinueza #DaleJohnDale #AlcaldíaDeLaGente. Ninguno de los textos de ejemplo menciona un partido, alianza o lista. Es contenido de la Biblioteca de Meta, no prueba de afiliación.", "dudas": "(1) Cambio de organización entre elecciones: en 2023 fue por «Vecinos en Acción» (lista 1-33, Centro Democrático y Reto) y en 2026 figura en la lista 1-21 «Cuidamos de la Gente»; las fuentes no explican qué organización es la lista 21 ni si Reto sigue en la alianza. (2) Dos descripciones de 2026: en agosto, «con el auspicio de Centro Democrático (lista 1)»; en octubre, «Cuidamos de la Gente (1-21)»; no se contradicen necesariamente, pero conviene confirmarlo en el CNE. (3) En enero de 2026 decía que no buscaría la reelección; en agosto se inscribió. (4) El vínculo entre la página y el candidato se deduce del nombre y del contenido de los anuncios; ninguna fuente lo documenta. (5) En las fuentes abiertas consultadas no apareció impugnación ni descalificación de su candidatura (búsqueda limitada). Las notas de La Prensa y Diario Los Andes de octubre listan los nueve candidatos en firme de Riobamba con su lista y sirven para otras entradas de Riobamba (p. ej. Santiago Abarca Vintimilla: Unidos Somos Más, lista 18-69).", "pendiente": "1) Confirmar con la lista oficial de candidaturas calificadas del CNE (esperada el 9-nov-2026) la organización exacta de la lista 1-21 «Cuidamos de la Gente» y sus integrantes. 2) Confirmar que la página «Amigos De John Vinueza» es de su campaña (descargo «Pagado por» en la Biblioteca de Anuncios o registro de campaña); si no, mantener solo «apoya a». 3) Decidir si el campo partido debe ser «Cuidamos de la Gente» (nombre de la lista en el CNE) o «Centro Democrático».", "duplicado": null, "consultas": ["John Vinueza alcalde Riobamba reelección 2026 candidatura movimiento", "candidatos alcaldía Riobamba 2026 John Vinueza inscripción CNE", "John Vinueza \"Riobamba\" candidato reelección alianza \"Avancemos\" OR \"Centro Democrático\" OR \"RETO\" 2026", "alcalde Riobamba John Vinueza movimiento político lista 2023 alianza ganó alcaldía Riobamba", "\"Vinueza\" Riobamba \"buscará la reelección\" OR \"candidato a la reelección\" OR \"precandidato\" alcalde Chimborazo 2026", "Riobamba alcaldía 2026 candidatos Cadena OR Vinueza OR Guamán inscritos seccionales noviembre (modo extendido)", "John Vinueza Riobamba reelección \"Cuidamos de la Gente\" OR \"Centro Democrático\" OR \"RETO\" OR \"CREO\" candidato 2026 alianza Chimborazo (modo extendido)", "\"Cuidamos de la Gente\" Vinueza Riobamba lista 1-21", "\"Cuidamos de la Gente\" alianza Ecuador seccionales 2026 Centro Democrático", "\"Dale John Dale\" Riobamba (y 3 variantes más no listadas por el máximo de 10; dos búsquedas finales bloqueadas por el límite compartido)"], "avisos": [], "ejemplos": [{"fecha": "2026-11-04", "texto": "MAGUAZO: EL AGUA QUE TARDÓ UNA GENERACIÓN 💧 Hay hijos que crecieron escuchando la misma promesa que sus padres: «Ahora sí va a llegar el agua». La obra comenzó en 2017 y debía entregarse en 2019. Pero llegaron las ampliaciones, los incumplimientos y una glosa de casi 1,45 millones de dólares contra el administrador, la…", "enlace": "https://www.facebook.com/ads/library/?id=1065848956484380"}, {"fecha": "2026-11-02", "texto": "¡Volvimos a escuchar el silbato del tren de Riobamba! Reparamos su motor, recuperamos sus espacios y vimos cómo nuestra locomotora roja volvía a moverse. Con ella despertaron recuerdos, ilusiones y la esperanza de muchas familias. Pero cuando quisimos dar el siguiente paso, la autorización para iniciar operaciones no c…", "enlace": "https://www.facebook.com/ads/library/?id=1148015954400196"}], "notas_previas": "Amigos De John Vinueza (Riobamba) | Apoya al alcalde J rera, #LaAurora, #CabeceraCantonal, #PlanDauleDeAcero. Algunos textos presentan por nombre a vecinos y líderes comunitarios de parroquias de Daule. El hashtag #MarianaHerrera también aparece en la página B60 «Acción Por Durán» (dato de Meta, no prueba de vínculo).", "dudas": "Nombre común: hay otras personas con el mismo nombre en otros países (por ejemplo, Colombia); dentro de Ecuador solo se encontró a la concejal de Daule. No hay fuente de 2026 sobre su candidatura (alcaldía o concejalía) ni sobre su organización política; la nota de 2023 no dice partido y no debe usarse para inferirlo. No aparece en la lista parcial de calificadas de KCH (19-sep-2026), que incluye solo a algunas candidaturas. No se pudo ampliar la búsqueda porque se agotó el presupuesto compartido de búsquedas web.", "pendiente": "Buscar a «Herrera García Mariana» entre las candidaturas calificadas del CNE para Daule (alcaldía y concejalías) cuando se publique la lista oficial (esperada el 9-nov-2026), o en el aviso de pago y transparencia de la página; solo entonces proponer partido. Confirmar también que la página es de la concejal y no de una homónima.", "duplicado": null, "consultas": ["Mariana Herrera candidata alcaldía Daule 2026", "\"Mariana Herrera\" Daule alcaldía ADN candidata", "candidatos alcaldía de Daule 2026 seccionales inscritos Fricson George ADN Herrera", "\"Mariana Herrera\" concejal Daule candidata alcaldesa", "Daule alcaldía candidatos 2026 Leyda Villegas Madeline Cañizares Fricson George Mariana Herrera lista", "\"Plan Daule de Acero\" OR \"Daule de Acero\" Mariana Herrera", "ADN inscribe candidaturas alcaldías Guayas Durán Daule Samborondón Milagro lista cantones"], "avisos": [], "ejemplos": [{"fecha": "2026-11-05", "texto": "Desayunar en el Recinto Santa María para poder conversar con cada bonita familia que estuvo con nosotros no tiene precio. 💛🫂 Muchas gracias por este cariño y sus buenas ideas. 🤝 #Daule #MarianaHerrera", "enlace": "https://www.facebook.com/ads/library/ 6", "medio": "KCH Comunicación", "fecha": "2026-09-19", "tipo_fuente": "prensa", "afirma": "Entre las alcaldías calificadas en Guayas, Durán figura con Álex León (ADN, 7), Rodrigo Aparicio (CD, 1) y Domitila Granja (PSP, 3)."}], "adicionales": {"jurisdiccion": "Cantón Durán (Guayas), según el contenido de sus anuncios"}, "vinculos": [], "datos_meta": "133 anuncios entre 2026-10-07 y 2026-11-05, gasto medio estimado 6584 USD, alcance 100 % Guayas; el pagador declarado es la propia página. Hashtags: #Duran, #JuntosPorDuran, #ChiquiHalloween. Comparte el hashtag #JuntosPorDuran con la página B60 «Acción Por Durán». Las cuatro muestras de texto no declaran partido ni candidatura.", "dudas": "El nombre de la página incluye «ADN», pero por regla no se usa como prueba. Ninguna de las cuatro muestras de anuncio declara partido ni candidatura, y no se pudo abrir la Biblioteca de Anuncios para revisar los 133 anuncios. Un anuncio que lo declare permitiría proponerlo como autodeclarado (confianza baja). Los listados de KCH son parciales y de julio y septiembre de 2026.", "pendiente": "Revisar en la Biblioteca de Anuncios (con sesión) si algún anuncio de la página declara su organización o la candidatura que apoya; en ese caso proponer «ADN» como autodeclarado (confianza baja) citando ese anuncio. Comparar con la candidatura de Álex León (ADN, lista 7) en la lista oficial del CNE (esperada el 9-nov-2026). Si resulta ser la página de campaña de un candidato, el tipo sería «candidato».", "duplicado": "B60 Acción Por Durán (misma zona y mismo hashtag #JuntosPorDuran; relación no confirmada por ninguna fuente)", "consultas": ["candidato alcaldía Durán 2026 ADN seccionales", "Alcaldía de Durán candidatos calificados CNE noviembre 2026 ADN Álex León Chonillo", "\"Álex León\" Durán candidato alcalde ADN campaña \"Juntos por Durán\"", "ADN inscribe candidaturas alcaldías Guayas Durán Daule Samborondón Milagro lista cantones"], "avisos": [], "ejemplos": [{"fecha": "2026-10-28", "texto": rtido 2026 apoyo candidatura"], "avisos": ["Búsqueda corta: solo 2 consulta(s) (se agotó el límite de búsquedas); conviene repetirla"], "ejemplos": [{"fecha": "2026-11-05", "texto": "🎤 ¡𝐀𝐳𝐨𝐠𝐮𝐞𝐬 𝐜𝐨𝐧𝐭𝐢𝐧𝐮́𝐚 𝐜𝐨𝐧 𝐥𝐚𝐬 𝐟𝐢𝐞𝐬𝐭𝐚𝐬 𝐧𝐨𝐯𝐞𝐦𝐛𝐫𝐢𝐧𝐚𝐬! 🎉🇭🇺 ♦️ Te invitamos a una noche espectacular con Sahiro, Los Hermanos Núñez y 5to Malo. 📅 Sábado, 7 de noviembre ⏰ 20:00 📍 Centro de Revisión Técnica Vehicular (San Pedro) ☝️ Evento gratuito #EnAzoguesMismoEs", "enlace": "https://www.facebook.com/ads/library/?id=1127532763608329"}, {"fecha": "2026-11-04", "texto": "¡La música y la celebración por las fiestas de Azogues continúan! 🎶🇭🇺 ♦️ Te presentamos a los artistas que nos harán cantar, bailar y disfrutar en el Show #EnAzoguesMismoEs, con canciones que han marcado generaciones y siguen conquistando corazones. 📅 Sábado, 7 de noviembre ⏰ 20:00 📍 Centro de Revisión Técnica Vehicula…", "enlace": "https://www.facebook.com/ads/library/?id=1899729051438431"}], "notas_previas": ""}, {"clave": "B30", "nombre": "Alianza Tsáchila", "origen": "sin_registro", "page_ids": ["416401408230937"], "etiqueta": "14 anuncios · USD 5.593 · Santo Domingo de los Tsáchilas 100%, Imbabura 0%", "pagador": false, "paginas_que_paga": [], "pagadores": ["Alianza Tsáchila"], "resultado": "parcial", "confianza": "baja", "motivo": "Solo hay la autodeclaración de la página en sus anuncios y una tabla de Wikipedia que liga el nombre «Alianza Tsáchila» con la lista 62 en la carrera por la Alcaldía. Ninguna nota de prensa ni lista del CNE consultada nombra a Javier Aguavil ni dice qué organizaciones forman la alianza.", "quien_es": "Página de Facebook «Alianza Tsáchila» (Santo Domingo de los Tsáchilas). Sus anuncios de septiembre de 2026 presentan a Javier Aguavil («El Tsáchila Aguavil») como candidato a Prefecto de la provincia. Una tabla de Wikipedia (no fuente principal) lista una «Alianza Tsáchila», lista 62, entre las 10 candidaturas a la Alcaldía de Santo Domingo, con Carlos Landaheta Pino (exviceprefecto) como candidato.", "tipo": null, "partido": null, "afiliacion": "Autodeclarada: la página presenta a Javier Aguavil como candidato a la Prefectura de Santo Domingo de los Tsáchilas (anuncio del 9-sep-2026); sin confirmación de prensa ni del CNE", "fuente": "https://www.facebook.com/ads/library/?id=4824292217802305", "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https://www.facebook.com/ads/library/?id=4824292217802305", "medio": "Anuncio de la propia página (Biblioteca de Anuncios de Meta; no se abre sin sesión, citado desde el expediente)", "fecha": "2026-09-09", "tipo_fuente": "propia", "afirma": "Presenta a Javier Aguavil como candidato a Prefecto de Santo Domingo de los Tsáchilas, con un mensaje de transparencia y trabajo por la provincia."}, {"url": "https://es.wikipedia.org/wiki/Elecciones_municipales_de_Santo_Domingo_de_los_Colorados_de_2026", "medio": "Wikipedia (pista de apoyo, no fuente principal)", "fecha": "2026-11-06", "tipo_fuente": "otra", "afirma": "Su tabla de las 10 candidaturas a la Alcaldía anota lista 62, Alianza Tsáchila, Carlos Landaheta Pino (viceprefecto 2023-2026). No cita a Aguavil."}, {"url": "https://www.eldiario.ec/santo-domingo-2/gobierno-provincial-designo-a-alfonso-andrade-como-nuevo-viceprefecto-de-santo-domingo-de-los-tsachilas-06082026/", "medio": "El Diario (sección Santo Domingo)", "fecha": "2026-08-06", "tipo_fuente": "prensa", "afirma": "Landaheta renunció a la Viceprefectura y todo apunta a que buscará la Alcaldía; la nota no nombra movimiento ni alianza ni a Aguavil."}, {"url": "https://www.expreso.ec/politica/elecciones-seccionales-2026-precandidatos-prefecturas-provincia-provincia-287959.html", "medio": "Expreso", "fecha": "2026-07-03", "tipo_fuente": "prensa", "afirma": "Para la Prefectura de Santo Domingo solo nombra a Lady Cedeño (Unidad Popular) y Alberto Pantoja (Amigo); no menciona a Aguavil."}, {"url": "https://www.eldiario.ec/santo-domingo-2/vialidad-gestion-de-recursos-y-programas-sociales-estan-entre-las-propuestas-de-alexandra-torres-04102026/", "medio": "El Diario (sección Santo Domingo)", "fecha": "2026-10-04", "tipo_fuente": "prensa", "afirma": "Alexandra Torres es candidata a la Prefectura (etiqueta «Partido Socialista Ecuatoriano»); la nota no nombra a otros candidatos ni a Aguavil."}], "adicionales": {"candidatura_2026": "Prefectura de Santo Domingo de los Tsáchilas (Javier Aguavil), según los anuncios de la página; no confirmada por prensa", "lista": "62, según la tabla de Wikipedia sobre la Alcaldía y según páginas de encuestas locales citadas en la revisión anterior; sin fuente oficial", "jurisdiccion": "Provincia de Santo Domingo de los Tsáchilas", "estado_candidatura": "Sin confirmar (ni inscripción ni calificación comprobadas)"}, "vinculos": [], "datos_meta": "14 anuncios entre 2026-09-04 y 2026-10-24; gasto medio estimado 5.593 USD; alcance 100 % en Santo Domingo de los Tsáchilas; pagador declarado = Alianza Tsáchila. Dos anuncios del 9-sep presentan a Javier Aguavil como candidato a Prefecto; otros dos están en primera persona, firmados como Tsáchila Aguavil, y hablan de empleo juvenil y producción.", "dudas": "Avance respecto a la pista anterior: la lista 62 sí aparece ligada al nombre «Alianza Tsáchila», pero en la carrera por la Alcaldía y con otro candidato (Carlos Landaheta Pino), y solo en Wikipedia. Sigue sin haber nota de prensa que nombre a Javier Aguavil como candidato a la Prefectura ni que diga qué organizaciones forman la alianza. Homónimos: un Javier Aguavil figura como predecesor de Diana Aguavil como gobernador de la nacionalidad tsáchila (ficha de Wikipedia); nada lo liga con este candidato y no se afirma que sean la misma persona. La nacionalidad tsáchila eligió nuevo gobernador el 23-ago-2026 (Miguel Aguavil asumió, según El Diario del 12-sep) y no se relaciona con esta candidatura. Contexto de la Prefectura según la prensa leída: Wilson Erazo (ADN; Expreso, 11-ago-2026), Alexandra Torres (etiqueta PSE; El Diario, 4-oct-2026) y Amy Gende (exasambleísta; El Diario, 6-sep-2026). Solo se pudo ejecutar una búsqueda web para este objetivo antes de agotarse la cuota; el resto fueron lecturas directas de páginas.", "pendiente": "Abrir en Voto Informado del CNE (votoinformado.cne.gob.ec, enlazado por El Diario el 1-nov-2026; la página no se pudo leer sin navegador) o en la lista de candidaturas calificadas del CNE (prevista para el 9-nov-2026) la candidatura «Alianza Tsáchila» (lista 62): qué organizaciones la forman y quiénes son sus candidatos a Prefectura y Alcaldía, y confirmar si Javier Aguavil es el candidato a la Prefectura. Si se confirma que es una alianza, el tipo sugerido sería «partido» con partido = «Alianza Tsáchila» (como otras alianzas del archivo); si no se confirma, dejar la autodeclaración de baja confianza o la entrada sin afiliación. Conviene repetir la búsqueda web (Javier Aguavil Prefectura Santo Domingo; Alianza Tsáchila lista 62 CNE) cuando se restablezca la cuota.", "duplicado": null, "consultas": ["candidatos Prefectura Santo Domingo de los Tsáchilas 2026 Javier Aguavil lista", "Lectura de El Diario: etiquetas javier-aguavil y alianza-tsachila (404), nacionalidad-tsachila, prefectura y prefectura-de-santo-domingo", "Lectura de Wikipedia: Elecciones municipales de Santo Domingo de los Colorados de 2026", "Lectura de Expreso (3-jul y 11-ago-2026) y de El Diario (6-ago, 6-sep y 4-oct-2026)"], "avisos": [], "ejemplos": [{"fecha": "2026-09-09", "texto": "Conoce una nueva propuesta para la Prefectura de Santo Domingo de los Tsáchilas. Javier Aguavil — El Tsáchila Aguavil Candidato a Prefecto de Santo Domingo de los Tsáchilas. Su candidatura se presenta bajo el mensaje de transparencia en la gestión, responsabilidad y trabajo por la provincia.", "enlace": "https://www.facebook.com/ads/library/?id=4824292217802305"}, {"fecha": "2026-09-09", "texto": "Conoce una nueva propuesta para la Prefectura. Javier Aguavil — El Tsáchila Aguavil Candidato a Prefecto de Santo Domingo de los Tsáchilas.", "enlace": "https://www.facebook.com/ads/library/?id=28331389386501148"}], "notas_previas": "Alianza Tsáchila (Santo Domingo) | Anuncia a Javier Aguavil como candidato a la Prefectura; páginas de encuestas lo ponen en la «Lista 62». | Ninguna nota de prensa lo confirma."}, {"clave": "B34", "nombre": "Pichincha Ciudadano", "origen": "sin_registro", "page_ids": ["491050254081512"], "etiqueta": "80 anuncios · USD 5.160 · Pichincha 100%, Imbabura 0%", "pagador": false, "paginas_que_paga": [], "pagadores": ["Pichincha Ciudadano"], "resultado": "parcial", "confianza": "baja", "motivo": "Autodeclarada: solo el anuncio de la propia página (16-oct-2026) dice «Con el respaldo de la Alianza Ciudadana Listas 2, 17, 70». La prensa confirma la alianza y sus listas, pero ninguna fuente hallada menciona la página; respaldo no equivale a ser la página oficial de la alianza.", "quien_es": "Página política que opera en Pichincha; no se halló en fuentes públicas quién la administra. En un anuncio dice contar con el respaldo de la Alianza Ciudadana, listas 2, 17 y 70. Según la prensa, esa alianza (Unidad Popular, Partido Socialista Ecuatoriano y movimiento provincial Todos) postula a Alexandro Tonello a la Prefectura de Pichincha y a Pabel Muñoz a la Alcaldía de Quito.", "tipo": "otro", "partido": "Alianza Ciudadana", "afiliacion": "Declara en un anuncio contar con el respaldo de la Alianza Ciudadana (Unidad Popular lista 2, PSE lista 17, Todos lista 70); autodeclarada", "fuente": "https://www.facebook.com/ads/library/?id=1421940052776674", "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https://www.facebook.com/ads/library/?id=1421940052776674", "medio": "Biblioteca de Anuncios de Meta (anuncio de la propia página)", "fecha": "2026-10-16", "tipo_fuente": "propia", "afirma": "El texto del anuncio, tomado del expediente (no se abre sin sesión), dice que avanzan con el respaldo de la Alianza Ciudadana, listas 2, 17, 70."}, {"url": "https://www.teleamazonas.com/actualidad/noticias/politica/pichincha-registro-inscritos-elecciones-seccionales-125644/", "medio": "Teleamazonas", "fecha": "2026-08-18", "tipo_fuente": "prensa", "afirma": "Alianza Ciudadana (Unidad Popular lista 2, PSE lista 17, Todos lista 70): Pabel Muñoz en Quito y Alexandro Tonello Carrera en la Prefectura."}, {"url": "https://kchcomunicacion.com/?p=533190", "medio": "KCH FM", "fecha": "2026-09-07", "tipo_fuente": "prensa", "afirma": "Alexandro Tonello Carrera, Alianza Ciudadana, listas 2-17-70; alianza de Unidad Popular, PSE y Todos, entre las candidaturas calificadas a la Prefectura."}, {"url": "https://www.expreso.ec/politica/unidad-popular-logra-acuerdo-correismo-asi-operara-alianza-ciudadana-pichincha-291623.html", "medio": "Expreso", "fecha": "2026-08-06", "tipo_fuente": "prensa", "afirma": "La alianza ciudadana agrupa a Unidad Popular, Revolución Ciudadana, PSE y Todos; Muñoz va por la reelección y Tonello por la Prefectura."}, {"url": "https://www.primicias.ec/politica/gobierno-daniel-noboa-contraloria-contratos-irregulares-prefectura-pichincha-viceprefecto-135992/", "medio": "Primicias", "fecha": "2026-10-29", "tipo_fuente": "prensa", "afirma": "Tonello renunció a la Viceprefectura el 13-ago-2026 para buscar la Prefectura; Andrei Iza Romero es el viceprefecto actual."}], "adicionales": {"lista": "2-17-70 (Alianza Ciudadana, según la propia página y la prensa)", "jurisdiccion": "Provincia de Pichincha"}, "vinculos": [], "datos_meta": "Página «Pichincha Ciudadano» (id 491050254081512): 80 anuncios entre el 2026-10-08 y el 2026-10-16, gasto medio estimado ~USD 5.160, alcance 100 % en Pichincha; la paga la propia página. Los textos hablan de la Prefectura y de «un viceprefecto» sin nombrarlo (#PichinchaVaBien, #PrefecturaDePichincha, #AlianzaCiudadana). No se usó ese texto para deducir de quién es la página.", "dudas": "«Pichincha Ciudadano» no aparece en ninguna nota hallada; no se sabe si es una página de campaña de la alianza, de simpatizantes o de otro tipo. El viceprefecto cambió el 13-ago-2026 (Tonello renunció; Primicias nombra a Andrei Iza Romero como actual), así que la mención a «un viceprefecto» es ambigua y no se interpretó. Algunos medios añaden a Revolución Ciudadana como parte o apoyo de la alianza; otros solo citan UP, PSE y Todos.", "pendiente": "Abrir el anuncio 1421940052776674 en la Biblioteca de Meta (con sesión), comprobar el texto y la transparencia de la página (administradores, fecha de creación) y decidir si se acepta como autodeclarada; buscar si la página figura en la rendición de gastos de campaña de la alianza.", "duplicado": null, "consultas": ["\"Pichincha Ciudadano\" Alexandro Tonello Alianza Ciudadana prefectura", "\"Pichincha Ciudadano\" página Facebook anuncios Tonello prefectura", "Páginas abiertas: Expreso 6-ago, Teleamazonas 18-ago, KCH 7-sep, Primicias 29-oct, Primicias 28-sep"], "avisos": [], "ejemplos": [{"fecha": "2026-10-08", "texto": "Un viceprefecto así de preparado, con capacidad y que conoce y siente la realidad de nuestra provincia, es quien debe continuar ahora al mando de la prefectura. En Calderón se fortalece la atención en salud, protección contra la violencia de género y apoyo al emprendimiento. ¡Pichincha va bien! #PichinchaVaBien #Prefec…", "enlace": "https://www.facebook.com/ads/library/?id=1432651378839724"}, {"fecha": "2026-10-16", "texto": "La unidad y la defensa de la democracia son fundamentales frente a las restricciones y la persecución política. Con el respaldo de la Alianza Ciudadana Listas 2, 17, 70, avanzamos firmemente hacia un futuro de progreso, justicia y desarrollo para toda la provincia. #Pichincha #AlianzaCiudadana #Democracia #PichinchaVa …", "enlace": "https://www.facebook.com/ads/library/?id=1421940052776674"}], "notas_previas": ""}, {"clave": "B36", "nombre": "Mariella Bravo de Lorences", "origen": "sin_registro", "page_ids": ["1219861647877887"], "etiqueta": "100 anuncios · USD 4.950 · Los Ríos 77%, Guayas 19%", "pagador": false, "paginas_que_paga": [], "pagadores": ["Mariella Bravo de Lorences"], "resultado": "parcial", "confianza": "baja", "motivo": "Solo hay una autodeclaración en un anuncio de la propia página, tomada del expediente (el enlace exige sesión); ni prensa ni CNE la confirman y no se conoce la organización.", "quien_es": "Página de Facebook (id 1219861647877887) que se presenta, en un anuncio del 2026-10-25, como la de una precandidata a la Alcaldía de Babahoyo (Los Ríos). No encontré notas de prensa ni listas del CNE que la nombren, así que su candidatura y la organización por la que iría no están confirmadas.", "tipo": "candidato", "partido": null, "afiliacion": "Precandidata a la Alcaldía de Babahoyo (autodeclarada en un anuncio de la propia página, 2026-10-25); organización no indicada", "fuente": "https://www.facebook.com/ads/library/?id=1493927102568002", "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https://www.facebook.com/ads/library/?id=1493927102568002", "medio": "Biblioteca de Anuncios de Meta (página de la propia persona)", "fecha": "2026-10-25", "tipo_fuente": "propia", "afirma": "La página dice que fue invitada a «La Plena y Sin Tapujos» para hablar de su camino como precandidata a la alcaldía de Babahoyo."}], "adicionales": {"candidatura_2026": "Precandidata a la Alcaldía de Babahoyo (autodeclarada, 2026-10-25)", "jurisdiccion": "Cantón Babahoyo (Los Ríos)", "estado_candidatura": "Precandidata según su propia página; inscripción y calificación no confirmadas"}, "vinculos": [], "datos_meta": "100 anuncios entre 2026-08-11 y 2026-11-04 (gasto medio USD 4950 según el expediente), pagados por la propia página. Alcance: Los Ríos 77 %, Guayas 19 %, Bolívar 1 %, Manabí 1 %. Etiquetas: #BabahoyoYoSíCumpliré, #EscucharParaCumplir, #EscucharParaUNIR, #UNIR, #PoderFluminense. Un anuncio presenta un proyecto llamado «Alcaldía Móvil».", "dudas": "Autodeclaración sin confirmar por prensa ni CNE. Las etiquetas #UNIR y #PoderFluminense podrían ser lemas o el nombre de una organización; no se asigna nada por ellas (regla 1). El nombre en la página incluye «de Lorences»; en los listados oficiales podría aparecer sin ese apellido o en otro orden. Las notas consultadas sobre Los Ríos (KCH, Vistazo, Extra y Expreso; junio y julio de 2026) no listan precandidaturas a la Alcaldía de Babahoyo. La búsqueda web se agotó antes de probar más variantes.", "pendiente": "Buscar «Bravo» en la lista de candidaturas calificadas del CNE para la Alcaldía de Babahoyo (publicación prevista el 9-nov-2026); de ahí salen la organización y el número de lista. Decidir si se registra la autodeclaración sin partido o se deja en blanco hasta tenerla.", "duplicado": null, "consultas": ["Mariella Bravo de Lorences Babahoyo alcaldía candidata 2026", "Babahoyo candidatos a la alcaldía seccionales 2026 Los Ríos quiénes son", "\"Mariella Bravo\" Babahoyo alcaldía", "\"Babahoyo\" alcaldía 2026 precandidatos \"Carlos Germán\" OR \"Mariella Bravo\" OR \"Vanessa Freire\" OR \"Gustavo Barquet\""], "avisos": [], "ejemplos": [{"fecha": "2026-10-27", "texto": "📢 La calle Eloy Alfaro merece respeto y progreso. Ayer Sábado 17 compartí con los moradores de este importante sector. Es evidente que en años anteriores no hubo el trabajo que ustedes merecían. Pero no nos quedamos mirando al pasado: construyamos un futuro diferente. 💪 ✅ Mi compromiso: Atención real, obras constantes …", "enlace": "https://www.facebook.com/ads/library/?id=1940381616923227"}, {"fecha": "2026-10-25", "texto": "¡𝗬𝗔 𝗕𝗔𝗦𝗧𝗔 𝗗𝗘 𝗤𝗨𝗘 𝗡𝗢 𝗟𝗘 𝗖𝗨𝗠𝗣𝗟𝗔𝗡 𝗔 𝗕𝗔𝗕𝗔𝗛𝗢𝗬𝗢! Basta de inundaciones que se llevan el esfuerzo de nuestras familias, de obras que apenas son parches y de oportunidades que nunca llegan. Basta de vivir entre la inseguridad, la violencia y el abandono. 𝙉𝙤 𝙡𝙡𝙚𝙫𝙤 𝙖𝙣̃𝙤𝙨 𝙥𝙧𝙚𝙥𝙖𝙧𝙖𝙣𝙙𝙤 𝙪𝙣𝙖 𝙘𝙖𝙣𝙙𝙞𝙙𝙖𝙩𝙪𝙧𝙖 𝙣𝙞 𝙪𝙩𝙞𝙡𝙞𝙯𝙖𝙣𝙙𝙤 𝙡𝙖 𝙨𝙤𝙡𝙞𝙙𝙖𝙧𝙞𝙙𝙖𝙙 𝙥𝙖…", "enlace": "https://www.facebook.com/ads/library/?id=1618769693063396"}], "notas_previas": ""}, {"clave": "A11", "nombre": "Rommel Durán", "origen": "por_completar", "page_ids": ["1255697507626235"], "etiqueta": "22 anuncios · USD 1.089 · Loja 78%, Guayas 5%", "pagador": false, "paginas_que_paga": [], "pagadores": ["Ec Protect Rigths", "Donesitios"], "resultado": "parcial", "confianza": "baja", "motivo": "Solo hay autodeclaración en un anuncio de la página (Biblioteca de Meta, 17-sep-2026, no abierta por requerir sesión). La prensa nombra la lista «Catamayo Unido 107» solo para el suplente de su concejalía y no dice que él pertenezca al movimiento; esa nota tiene más de un año.", "quien_es": "Rommel Durán Paute figura como vicealcalde del cantón Catamayo (Loja) en una nota de Crónica de Loja de feb-2025; la alcaldesa es Janet Guerrero según el sitio oficial del GAD. No se halló fuente de 2026 sobre su candidatura. La coincidencia con la página se apoya en el nombre y en que sus anuncios hablan de Catamayo.", "tipo": "persona", "partido": "Catamayo Unido", "afiliacion": "Movimiento Catamayo Unido, lista 107 (autodeclarada en un anuncio de la propia página); vicealcalde de Catamayo según Crónica de Loja (feb-2025)", "fuente": "https://www.facebook.com/ads/library/?id=2017945205574213", "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https://www.facebook.com/ads/library/?id=2017945205574213", "medio": "Biblioteca de Anuncios de Meta (página Rommel Durán)", "fecha": "2026-09-17", "tipo_fuente": "propia", "afirma": "El texto del anuncio de la página incluye «Movimiento Catamayo Unido 107» junto a los hashtags #ConRommelSiVoy y #JuntosHaremosHistoria (según el expediente)."}, {"url": "https://cronica.com.ec/2025/02/19/amenazas-contra-el-vicealcalde-de-catamayo-rommel-duran/", "medio": "Crónica de Loja", "fecha": "2025-02-19", "tipo_fuente": "prensa", "afirma": "Rommel Durán Paute es vicealcalde de Catamayo; su concejal alterno fue reemplazado por la siguiente de la lista del Movimiento Catamayo Unido, lista 107 (I)."}, {"url": "https://catamayo.gob.ec/", "medio": "GAD Municipal de Catamayo (sitio oficial)", "fecha": "2026-11-06", "tipo_fuente": "oficial", "afirma": "La alcaldesa actual es Janet Guerrero; la portada no menciona a Rommel Durán ni indica movimiento."}], "adicionales": {"cargo_actual": "Vicealcalde de Catamayo según Crónica de Loja (19-feb-2025); no confirmado para 2026", "lista": "107 (autodeclarada en anuncio de la página)", "jurisdiccion": "Cantón Catamayo, provincia de Loja"}, "vinculos": [{"descripcion": "Crónica de Loja informa que el suplente de su concejalía fue reemplazado por la siguiente persona de la lista del Movimiento Catamayo Unido, lista 107 (I). No afirma que él sea de ese movimiento.", "fuente": "https://cronica.com.ec/2025/02/19/amenazas-contra-el-vicealcalde-de-catamayo-rommel-duran/", "fecha": "2025-02-19"}], "datos_meta": "22 anuncios (primero 2026-09-05, último 2026-11-03), alcance 78 % Loja. Pagadores declarados: «Ec Protect Rigths» (17 anuncios) y «Donesitios» (5). Los textos mencionan propuestas para Catamayo (terminal terrestre) y los hashtags #RommelDurán y #ConRommelSiVoy.", "dudas": "Un anuncio de la propia página nombra al «Movimiento Catamayo Unido 107»; la única nota de prensa hallada que lo nombra es de feb-2025 (más de un año) y no liga a Durán con el movimiento de forma explícita (no se infiere por la regla de la lista del suplente). No se halló si Durán es candidato en 2026 (alcaldía o concejalía) ni su organización en listas de prensa; no pude abrir el «Voto Informado» del CNE (habilitado el 31-oct-2026). Una búsqueda adicional por candidatos a la Alcaldía de Catamayo no devolvió nada; faltan por revisar otros medios de Loja (La Hora, diarios locales).", "pendiente": "Comprobar en el «Voto Informado» o la lista oficial del CNE (prevista para el 9-nov) si Rommel Durán Paute es candidato en Catamayo y por qué organización. Confirmar si «Movimiento Catamayo Unido, lista 107» existe en el registro de organizaciones del CNE. Decidir si el pagador «Ec Protect Rigths» y «Donesitios» se unifican o no (no hay fuente).", "duplicado": "Ec Protect Rigths (pagador de 17 de sus 22 anuncios; no se afirma que sea la misma entidad)", "consultas": ["Rommel Durán Catamayo alcalde candidato Movimiento Catamayo Unido 107", "Catamayo candidatos alcaldía 2026 Rommel Durán", "«Rommel Durán» Catamayo alcalde", "Catamayo alcaldía 2026 candidatos inscritos movimiento Catamayo Unido", "«Catamayo Unido» movimiento", "alcalde de Catamayo Rommel Durán GAD Municipal Catamayo reelección", "candidatos a la Alcaldía de Catamayo elecciones seccionales noviembre 2026 Janet Guerrero Rommel Durán", "[página abierta] catamayo.gob.ec", "[etiquetas abiertas] cronica.com.ec/tag/rommel-duran/, /tag/catamayo/, /tag/alcaldia-de-catamayo/"], "avisos": [], "ejemplos": [{"fecha": "2026-10-26", "texto": "Nuestra experiencia, conocimiento y compromiso con Catamayo respaldan nuestro trabajo. Creemos en la palabra, pero sobre todo, en la gestión y los resultados. ✍🏻 Hoy compartimos parte de nuestras propuestas para el desarrollo de nuestro cantón: 1.Terminal Terrestre: Gestionamos la donación de los terrenos donde se proy…", "enlace": "https://www.facebook.com/ads/library/?id=1810676800250255"}, {"fecha": "2026-10-22", "texto": "#𝗥𝗼𝗺𝗺𝗲𝗹𝗗𝘂𝗿𝗮́𝗻 | Mi mayor éxito y mi verdadero patrimonio son 𝗺𝗶𝘀 𝗵𝗶𝗷𝗼𝘀 𝘆 𝗺𝗶 𝗳𝗮𝗺𝗶𝗹𝗶𝗮. Mi riqueza está en los valores y principios que hemos compartido y enseñado en casa. Ver a mis hijos convertidos en profesionales es, sin duda, 𝗺𝗶 𝗺𝗮𝘆𝗼𝗿 𝘁𝗲𝘀𝗼𝗿𝗼. 𝗠𝗶 𝗽𝗮𝘀𝗶𝗼́𝗻 𝗻𝗼 𝗲𝘀 𝗲𝗹 𝗱𝗶𝗻𝗲𝗿𝗼, 𝗲𝘀 𝘀𝗲𝗿𝘃𝗶𝗿. Y así como cuido y defiendo a mi fa…", "enlace": "https://www.facebook.com/ads/library/?id=29189946367295419"}], "notas_previas": "Rommel Durán, Juan Altamirano (Loja) | Hacen campaña con candidatos a concejal. | No aparecen en las listas consultadas."}, {"clave": "A17", "nombre": "Carlos Torres Alvarado - El Máster", "origen": "por_completar", "page_ids": ["1392146503982087"], "etiqueta": "18 anuncios · USD 891 · Tungurahua 94%, Guayas 1%", "pagador": false, "paginas_que_paga": [], "pagadores": ["FØLK Studio"], "resultado": "parcial", "confianza": "baja", "motivo": "La candidatura solo consta en su propio sitio y anuncios; no hay nota de prensa ni listado del CNE que la confirme, y ninguna fuente nombra su movimiento, partido o lista.", "quien_es": "Según su sitio de campaña (pelileoconelmaster.com) y los textos de sus anuncios, Carlos Torres Alvarado, «el Máster», encabeza un equipo para la Alcaldía del cantón Pelileo (Tungurahua), con candidatos a concejal urbano y rural y a cinco juntas parroquiales. Sus anuncios lo presentan como maestro rural, rector fundador del Colegio Técnico Huasimpamba y rector del Instituto Tecnológico Superior Pelileo; son datos autodeclarados, sin contraste independiente.", "tipo": "candidato", "partido": null, "afiliacion": "Candidato a la Alcaldía de Pelileo, según su sitio de campaña (autodeclarado); organización política no indicada", "fuente": "https://pelileoconelmaster.com", "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https://pelileoconelmaster.com", "medio": "Sitio de campaña «El Pelileo que soñamos» (enlazado en los anuncios de la página)", "fecha": "2026-11-06", "tipo_fuente": "propia", "afirma": "Lo presenta bajo «Alcaldía de Pelileo» encabezando un equipo con concejales y juntas parroquiales; no cita movimiento, partido, alianza ni lista. Fecha = día de consulta."}], "adicionales": {"candidatura_2026": "Alcaldía de Pelileo (autodeclarada en su sitio de campaña)", "jurisdiccion": "Cantón Pelileo, Tungurahua", "estado_candidatura": "No confirmado por fuente oficial ni de prensa (sin listado del CNE a 2026-11-06)", "sitio_oficial": "https://pelileoconelmaster.com"}, "vinculos": [], "datos_meta": "Los 18 anuncios de la página (2026-10-15 a 2026-11-04; gasto medio del expediente aprox. USD 891) declaran como pagador a FØLK Studio (entrada A18). Alcance: Tungurahua 94 %. Los mismos anuncios (p. ej. ids 1449108207204685 y 1116026957794288) figuran en el expediente de FØLK Studio. Textos de ejemplo: seguridad y UPC cerradas en Pelileo, un nuevo hospital en Pelileo, su biografía y una invitación a sumarse en pelileoconelmaster.com. Hashtags: #ElPelileoQueSoñamos #Pelileo #SeguridadParaPelileo #CrónicaElectoral (este último también aparece en los anuncios de FØLK Studio).", "dudas": "Nombre muy común: las búsquedas devolvieron homónimos de México, Chile y otros países que no corresponden. pelileoconelmaster.com (consultado 2026-11-06) no menciona movimiento, partido, alianza, número de lista ni quién paga o administra el sitio. El único candidato a la Alcaldía de Pelileo que apareció en prensa es otra persona: Gabriel Zúñiga, con el movimiento Avanza, lista 8 (El Diario, 2026-07-21, https://www.eldiario.ec/centro/elecciones-seccionales-alcaldes-reeleccion-ecuador-21072026/); esa nota no menciona a Torres. La biografía (rector, etc.) es autodeclarada y no se contrastó.", "pendiente": "Consultar en el navegador la lista oficial de candidaturas calificadas del CNE (se esperaba para el 9-nov-2026, posterior a esta revisión; cne.gob.ec devolvió 403 a la herramienta de lectura y la delegación de Tungurahua salió vacía) para ver si está inscrito o calificado para la Alcaldía de Pelileo y con qué organización o lista. Hasta entonces no registrar partido. Búsquedas pendientes por límite agotado: «Carlos Torres Alvarado» Pelileo alcaldía lista OR movimiento; candidatos Pelileo 2026 calificados CNE; «Pelileo» alcaldía candidatos Tungurahua El Heraldo OR La Hora. No unificar con FØLK Studio (A18): son entidades distintas.", "duplicado": null, "consultas": ["Carlos Torres candidato alcalde Pelileo 2026 movimiento", "candidatos alcaldía Pelileo 2026 elecciones seccionales", "Pelileo alcaldía candidatos Gabriel Zúñiga Carlos Torres Alvarado movimiento lista", "\"Carlos Torres Alvarado\" Pelileo", "\"Carlos Torres\" rector Instituto Tecnológico Superior Pelileo candidato alcalde", "Aperturas: pelileoconelmaster.com (2 veces), eldiario.ec nota del 21-jul-2026, elheraldo.com.ec (portada sin notas relevantes); cne.gob.ec 403, delegaciones.cne.gob.ec/tungurahua vacío, lahora.com.ec/tungurahua 404"], "avisos": [], "ejemplos": [{"fecha": "2026-10-31", "texto": "¿Cómo puede haber seguridad si las UPC están cerradas? En Pelileo la inseguridad ya no es una noticia lejana. Hoy hay familias que revisan dos veces la puerta antes de dormir, comerciantes que trabajan con miedo y parroquias que sienten que nadie las cuida. Y mientras tanto, hay Unidades de Policía Comunitaria cerradas…", "enlace": "https://www.facebook.com/ads/library/?id=1449108207204685"}, {"fecha": "2026-10-28", "texto": "¿Quién es Carlos Torres? Un pelileño que empezó como maestro rural en los caseríos de nuestro cantón. Fue rector fundador del Colegio Técnico Huasimpamba, rector del Instituto Tecnológico Superior Pelileo y primer presidente nacional de la Asociación de Institutos Superiores Públicos del Ecuador. Su compromiso político…", "enlace": "https://www.facebook.com/ads/library/?id=1116026957794288"}], "notas_previas": ""}, {"clave": "A15", "nombre": "Windows City HD", "origen": "por_completar", "page_ids": ["289901048627699"], "etiqueta": "3 anuncios · USD 148 · Los Ríos 87%, Bolívar 13%", "pagador": false, "paginas_que_paga": [], "pagadores": ["WINDOWS CITY 4K"], "resultado": "parcial", "confianza": "baja", "motivo": "El tipo «medio» descansa en un extracto de buscador de un registro universitario que no pude abrir; ninguna fuente sobre propiedad, dirección o línea editorial. No se propone afiliación.", "quien_es": "Página de Facebook (id 289901048627699) cuyo único pagador declarado es «WINDOWS CITY 4K» y cuyo alcance es sobre todo Los Ríos. Un registro de repositorio universitario (visto solo en el extracto del buscador; no pude abrirlo) describiría «Windows City HD» como medio digital del cantón Ventanas (estudio sobre 2021). No hallé fuente sobre quién lo dirige ni su línea editorial.", "tipo": "medio", "partido": null, "afiliacion": null, "fuente": null, "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https:// o»; Expreso (3-jul) y El Diario (13-jul) lo llaman prefecto actual.", "tipo": "candidato", "partido": null, "afiliacion": null, "fuente": null, "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https://www.eluniverso.com/noticias/politica/alcaldia-de-machala-2027-de-los-diez-precandidatos-registrados-uno-ya-quedo-fuera-y-otro-esta-la-espera-de-la-resolucion-nota/", "medio": "El Universo", "fecha": "2026-09-18", "tipo_fuente": "prensa", "afirma": "Clemente Esteban Bravo Riofrío se inscribió por ADN (lista 7); el CNE anuló la calificación y ordenó a la Junta de El Oro una nueva resolución; el TCE admitió un recurso del PID."}, {"url": "https://www.expreso.ec/ecuador/machala-perfila-proxima-alcaldia-son-precandidatos-2026-287975.html", "medio": "Expreso", "fecha": "2026-07-03", "tipo_fuente": "prensa", "afirma": "Lista a Clemente Bravo Riofrío como precandidato a la Alcaldía de Machala por El Oro Primero; ADN presenta a Esteban Ordóñez."}, {"url": "https://www.eldiario.ec/centro/elecciones-seccionales-2026-el-18-de-julio-vence-el-plazo-para-registrar-alianzas-electorales-13072026/", "medio": "El Diario", "fecha": "2026-07-13", "tipo_fuente": "prensa", "afirma": "El prefecto habría mencionado que podría ir a la Alcaldía de Machala por ADN; sin confirmación oficial a esa fecha. ADN había presentado a Esteban Ordóñez."}, {"url": "https://www.primicias.ec/politica/elecciones/seccionales-adelantadas-2027/precandidatos-alcalde-prefecto-oro-machala-santa-rosa-pasaje-partidos-126959/", "medio": "Primicias", "fecha": "2026-07-02", "tipo_fuente": "prensa", "afirma": "Confirmó su precandidatura a la Alcaldía de Machala; el artículo no indica su movimiento."}, {"url": "https://www.primicias.ec/politica/dario-macas-renuncia-alcaldia-machala-carcel-cotopaxi-prision-caso-muralla-130010/", "medio": "Primicias", "fecha": "2026-08-11", "tipo_fuente": "prensa", "afirma": "Describe al movimiento SUR como «del actual prefecto de El Oro, Clemente Bravo» (a propósito de la conc erso, ese rechazo corresponde a Carlos Falquez (CREO), no a Bravo, y no se usa. Dos búsquedas adicionales (nov-2026) no hallaron nota posterior al 18-sep sobre la resolución de la Junta o del TCE; sigue pendiente.", "pendiente": "Confirmar con la lista oficial del CNE (9-nov) si Bravo figura como candidato a la Alcaldía de Machala y por qué organización (ADN lista 7, según la fuente más reciente). Si lo confirma, la propuesta sería «Acción Democrática Nacional (ADN), lista 7; candidato a la Alcaldía de Machala», fuente El Universo 18-sep-2026. Revisar si la candidatura sigue vigente tras la resolución de la Junta/TCE.", "duplicado": null, "consultas": ["Clemente Bravo candidato alcaldía de Machala 2026 movimiento inscripción", "Clemente Bravo renuncia Prefectura de El Oro candidato alcalde Machala ADN lista 7", "El Universo Alcaldía de Machala diez precandidatos registrados uno quedó fuera otro espera resolución Clemente Bravo ADN", "Clemente Bravo candidatura Machala Tribunal Contencioso Electoral PID resolución octubre 2026", "Clemente Bravo candidatura alcaldía de Machala Junta Electoral califica ADN octubre 2026", "Clemente Bravo ADN Machala alcaldía campaña candidato noviembre 2026", "[abiertos] Primicias 2-jul, 11-ago y 19-ago, Expreso 3-jul, El Diario 13-jul, El Universo 18-sep, KCH 18-sep-2026"], "avisos": [], "ejemplos": [{"fecha": "2026-09-21", "texto": "Machala al fin tendrá agua potable digna en TODOS los sectores, gracias a la GARANTÍA SOBERANA del Gobierno Nacional Con articulación y gestión lo haremos posible. ¡Machala será otra! 💜💪🏻", "enlace": "https://www.facebook.com/ads/library/?id=2484101702085702"}, {"fecha": "2026-10-29", "texto": "Machala, esta es la verdad que no te dicen los candidatos improvisados. No te dejes engañar hermano machaleño", "enlace": "https://www.facebook.com/ads/library/?id=1405551557976146"}], "notas_previas": "Todos con Clemente (Machala) | Apoya a Clemente Bravo Riofrío: El Oro Primero (Expreso), Movimiento SUR (El Universo) y posible ADN. | Fuentes distintas y un apoyo no prueba que la página sea del movimiento."}, {"clave": "B02", "nombre": "Secretaría General de Comunicación Ecuador", "origen": "sin_registro", "page_ids": ["400709789941558"], "etiqueta": "497 anuncios · USD 70.802 · Guayas 21%, Pichincha 20%", "pagador": false, "paginas_que_paga": [], "pagadores": ["Secretaría General de Comunicación Ecuador"], "resultado": "no_aplica", "confianza": "alta", "motivo": "Regla 12 (institución pública). Los sitios oficiales comunicacion.gob.ec y presidencia.gob.ec la identifican como órgano de la Presidencia, y ambos enlazan al perfil de Facebook ComunicacionEcuador. Falta comprobar que ese perfil sea el id 400709789941558.", "quien_es": "Secretaría General de Comunicación de la Presidencia de la República del Ecuador, con sede en Quito. Su sitio oficial dice que informa a la ciudadanía sobre las acciones del Gobierno Nacional, y la web de la Presidencia la lista entre sus secretarías.", "tipo": "gobierno", "partido": null, "afiliacion": "Sin afiliación (institución pública)", "fuente": "https://www.comunicacion.gob.ec", "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https://www.comunicacion.gob.ec", "medio": "Secretaría General de Comunicación (sitio oficial)", "fecha": "2026-11-06", "tipo_fuente": "oficial", "afirma": "Se identifica como Secretaría General de Comunicación de la Presidencia y dice informar a la ciudadanía sobre las acciones del Gobierno Nacional."}, {"url": "https://www.presidencia.gob.ec", "medio": "Presidencia de la República del Ecuador (sitio oficial)", "fecha": "2026-11-06", "tipo_fuente": "oficial", "afirma": "Su directorio de gobierno incluye la «Secretaría General de comunicación», con enlace a comunicacion.gob.ec."}, {"url": "https://www.primicias.ec/politica/voceros-presidencia-gobierno-secretaria-comunicacion-noboa-mensaje-redes-sociales-111650/", "medio": "Primicias", "fecha": "2025-12-13", "tipo_fuente": "prensa", "afirma": "Irene Vélez sobre propiedad, financiación ni alineación, por eso no se propone afiliación ni «Neutral».", "quien_es": "Se presenta como «Data News», un medio digital de noticias («una plataforma digital que comparte noticias relevantes de manera clara y sencilla»). Su sitio, datanews.ec, no identifica director, propietario, empresa ni ciudad, no muestra notas y su portada parece una plantilla sin terminar; enlaza a facebook.com/datanews.ec e instagram.com/datanews.ec.", "tipo": "medio", "partido": null, "afiliacion": null, "fuente": "https://datanews.ec", "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https://datanews.ec", "medio": "Datanews (sitio propio)", "fecha": "2026-11-06", "tipo_fuente": "propia", "afirma": "Se presenta como «un medio digital» de noticias; no nombra director, empresa ni ciudad; sin notas visibles; enlaza a facebook.com/datanews.ec e Instagram."}], "adicionales": {"sitio_oficial": "https://datanews.ec"}, "vinculos": [], "datos_meta": "78 anuncios (6-jul a 4-nov-2026) con un gasto medio de USD 3.861 según los datos; alcance Guayas 36 %, Pichincha 14 %, Manabí 9 %, El Oro 5 %. Pagador declarado: la propia página (78 anuncios). Los textos de ejemplo son notas breves sobre una medida de Banco del Pacífico en Galápagos, la campaña «Rompe el esquema» de la UAFE, un viaje del presidente Daniel Noboa a China y la recolección de ayuda humanitaria por un terremoto en Colombia; los hashtags incluyen #BiessATuServicio y #JóvenesEnAcción. Meta no indica quién contrata o financia los anuncios.", "dudas": "El sitio parece incompleto (plantilla, sin notas ni datos de contacto) y no se pudo confirmar que la página de Facebook con id 120537226572 sea la enlazada. No hay nota de prensa sobre el medio. Los anuncios tratan temas oficiales, pero eso no indica propiedad, alineación ni contratos. No se halló fuente que vincule a la página con pauta del Gobierno.", "pendiente": "Con sesión de Facebook, revisar «Información y transparencia de la página» (fecha de o un equipo de artes visuales, marketing y comunicación estratégica (branding, marketing digital, desarrollo web, redes sociales, consultoría y producción audiovisual), con dirección declarada en «GYE, EC» (Guayaquil). En Meta figura como pagador declarado de anuncios de la campaña de Carlos Torres Alvarado y de otras piezas sobre el cantón Pelileo (Tungurahua).", "tipo": "agencia", "partido": null, "afiliacion": "Sin afiliación política documentada (agencia de marketing y comunicación)", "fuente": "https://folk.ec", "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https://folk.ec", "medio": "Sitio de FØLK (folk.ec)", "fecha": "2026-11-06", "tipo_fuente": "propia", "afirma": "Se define como equipo de artes visuales, marketing y comunicación estratégica; no nombra clientes políticos ni responsables. Fecha = día de consulta."}, {"url": "https://lectura.folk.ec", "medio": "lectura.folk.ec (marca FØLK)", "fecha": "2026-11-06", "tipo_fuente": "propia", "afirma": "Página titulada «Pelileo decide · Encuesta ciudadana 2026»; el texto accesible no nombra candidatos ni quién la encarga."}], "adicionales": {"jurisdiccion": "Guayaquil (dirección declarada «GYE, EC»); sus anuncios en Meta se dirigen a Tungurahua", "sitio_oficial": "https://folk.ec"}, "vinculos": [], "datos_meta": "Pagador declarado de 49 anuncios (2026-09-09 a 2026-11-05; gasto medio del expediente aprox. USD 2 426); alcance 98 % Tungurahua. 18 de ellos son de la página «Carlos Torres Alvarado - El Máster» (A17, ID 1392146503982087) y los mismos anuncios aparecen en ambos expedientes (p. ej. ids 1449108207204685 y 1116026957794288). Otros textos de ejemplo hablan de parroquias de Pelileo (hashtags #OtroHuambalóEsPosible, #Huambaló, #BolívarNoSeDetiene, #CristinaFreire; el nombre Cristina Freire coincide con una candidata a la junta parroquial de Bolívar listada en pelileoconelmaster.com) y de una encuesta de intención de voto para la alcaldía de Pelileo (enlace lectura.folk.ec, anuncio del 2026-11-05) y formularios de Google. Hashtag común con A17: #CrónicaElectoral. Esto muestra que FØLK Studio paga los anuncios de la página de Torres; no dice quién la contrató ni quién financia.", "dudas": "No hay fuente externa sobre los clientes de FØLK Studio ni sobre quién contrata y financia los anuncios; ser pagador declarado no implica que la agencia forme parte de la candidatura ni que comparta su afiliación. Partes de folk.ec (equipo, blog y colaboradores) muestran contenido genérico que no permite identificar responsables ni clientes, y la dirección declarada es de Guayaquil aunque los anuncios apuntan a Tungurahua. La coincidencia de hashtags con la lista de candidatos de pelileoconelmaster.com es un indicio de Meta, no una fuente de contrato. Una sola búsqueda web antes de agotarse el límite compartido; no se halló prensa sobre la agencia.", "pendiente": "Registrar como agencia con partido en blanco. Para saber quién la contrata: revisar el descargo «Pagado por» en la Biblioteca de Anuncios y, cuando existan, los informes de gasto de campaña del CNE. No unificar con la página de Carlos Torres (A17): son entidades distintas (agencia pagadora y página de candidato). Búsquedas pendientes por límite agotado: «FØLK Studio» Guayaquil agencia clientes; «FØLK Studio» campaña Pelileo OR Tungurahua.", "duplicado": null, "consultas": ["FØLK Studio folk.ec Ambato agencia marketing político", "Aperturas: folk.ec (portada, /about-2/, /stories/) y lectura.folk.ec"], "avisos": [], "ejemplos": [{"fecha": "2026-11-05", "texto": "🗳️ ¡Pelileo, tu voto cuenta! Participa en esta encuesta sobre intención de voto para la próxima alcaldía del cantón. ¡Solo te tomará 1 minuto! 👉 https://lectura.folk.ec Compártela con tus amigos y familiares de Pelileo para llegar a más personas. ¡Gracias por participar! 🙌", "enlace": "https://www.facebook.com/ads/library/?id=2028865901107024"}, {"fecha": "2026-10-31", "texto": "¿Cómo puede haber seguridad si las UPC están cerradas? En Pelileo la inseguridad ya no es una noticia lejana. Hoy hay familias que revisan dos veces la puerta antes de dormir, comerciantes que trabajan con miedo y parroquias que sienten que nadie las cuida. Y mientras tanto, hay Unidades de Policía Comunitaria cerradas…", "enlace": "https://www.facebook.com/ads/library/?id=1449108207204685"}], "notas_previas": "**Agencias y consultoras** (Satori Publicidad, Goberna Ecuador, Management & Research Consulting, FØLK Studio, Political MKT, WIMI y similares): trabajan para varios clientes; no se asignan sin una fuente que lo diga."}, {"clave": "B49", "nombre": "Political MKT", "origen": "sin_registro", "page_ids": ["813263401867477"], "etiqueta": "64 anuncios · USD 4.068 · Guayas 79%, Manabí 7%", "pagador": false, "paginas_que_paga": [], "pagadores": ["Political MKT"], "resultado": "no_aplica", "confianza": "baja", "motivo": "El tipo «agencia» (empresa de encuestas) se apoya en la actividad que muestran sus anuncios y en la descripción de un sitio homónimo cuyo vínculo con la página no está confirmado; por eso no se propone fuente. No hay ninguna fuente sobre dueños ni clientes. Una agencia no lleva partido.", "quien_es": "Página que difunde encuestas digitales sobre intención de voto para las alcaldías y prefecturas del 29-nov-2026 (alcance 79 % en Guayas). Un sitio con el mismo nombre, politicalmkt.com, se describe como empresa de investigación de mercados y opinión pública, pero no indica país, dueños, equipo ni clientes y no se pudo comprobar que sea el de esta página.", "tipo": "agencia", "partido": null, "afiliacion": null, "fuente": null, "otros_nombres": [], "page_ids_extra": [], "fuentes": [{"url": "https://politicalmkt.com", "medio": "Political MKT (sitio homónimo)", "fecha": "2026-11-06", "tipo_fuente": "propia", "afirma": "Sitio homónimo: empresa de investigación de mercados y opinión pública; no indica país, dueños ni clientes. No se confirmó que sea el de la página."}], "adicionales": {}, "vinculos": [], "datos_meta": "64 anuncios (7-jul a 3-nov-2026) con un gasto medio de USD 4.068 según los datos; alcance Guayas 79 %, Manabí 7 %, Pichincha 5 %, El Oro 5 %. Pagador declarado: la propia página (64 anuncios). Los 4 textos de ejemplo invitan a responder encuestas sobre el voto para alcalde y prefecto (uno se dirige a «guayaquileños») y aseguran que las respuestas son confidenciales o anónimas; ninguno nombra a un cliente, candidato o partido. Meta no indica quién contrata los estudios.", "dudas": "No se halló ficha de prensa ni registro societario. No se puede descartar que existan otras empresas llamadas «Political MKT». El sitio politicalmkt.com no menciona Ecuador, elecciones ni campañas, y ofrece estudios de opinión pública entre otros servicios de mercado.", "pendiente": "Con sesión de Facebook, comprobar si la página enlaza politicalmkt.com y revisar «Información y transparencia de la página». Buscar razón social y representantes en la Superintendencia de Compañías o el SRI. Si se identifican clientes electorales, documentarlos con prensa y registrarlos como vínculos, no como afiliación.", "duplicado": null, "consultas": ["\"Political MKT\" Ecuador consultora marketing político"], "avisos": [], "ejemplos": [{"fecha": "2026-07-07", "texto": "Las elecciones locales están a la vuelta de la esquina. ¿Hacia dónde se inclina la balanza en tu localidad? SÉ PARTE del estudio digital que mide la intención de voto para alcaldías y prefecturas este 29 de noviembre. Resultados 100% confidenciales.", "enlace": "https://www.facebook.com/ads/library/?id=2101844040711491"}, {"fecha": "2026-10-29", "texto": "Guayaquileño, ¿ya sabes por quién vas a votar para alcalde en las próximas elecciones? Estamos realizando una encuesta digital sobre las preferencias y necesidades de la ciudad. Toma 2 minutos de tu tiempo y ayúdanos a construir una Guayaquil mejor. ¡Tu opinión es anónima y muy valiosa!", "enlace": "https://www.facebook.com/ads/library/?id=2177978006151850"}], "notas_previas": "**Agencias y consultoras** (Satori Publicidad, Goberna Ecuador, Management & Research Consulting, FØLK Studio, Political MKT, WIMI y similares): trabajan para varios clientes; no se asignan sin una fuente que lo diga."}, {"clave": "A07", "nombre": "Satori Publicidad", "origen": "por_completar", "page_ids": [], "etiqueta": "64 anuncios · USD 3.968 · Los Ríos 56%, Guayas 33%", "pagador": true, "paginas_que_paga": [{"pagina": "Eduardo Mendoza Palma", "page_id": "168388773939137", "anuncios": 34}, {"pagina": "Lalo Mendoza Hurtado", "page_id": "103803838238254", "anuncios": 30}], "pagadores": ["Satori Publicidad"], "resultado": "no_aplica", "confianza": "baja", "motivo": "El tipo se deduce del nombre y de la revisión previa; ninguna fuente externa lo confirma. No se propone afiliación: las agencias no tienen partido.", "quien_es": "Pagador declarado en la Biblioteca de Meta (sin página propia en los datos). Por su nombre y por la clasificación de la revisión previa del equipo (5-nov-2026) sería una agencia de publicidad; no encontré ficha pública (prensa o registro) que lo confirme ni que diga quién la dirige.", "tipo": "agencia", "partido": null, "afiliacion": null, "fuente": null, "otros_nombres": [], "page_ids_extra": [], "fuentes": [], "adicionales": {}, "vinculos": [], "datos_meta": "64 anuncios entre 2026-09-30 y 2026-11-04 (gasto medio USD 3968 según el expediente). Paga dos páginas: «Eduardo Mendoza Palma» (id 168388773939137; 34 anuncios; ya registrada como ADN y verificada) y «Lalo Mendoza Hurtado» (id 103803838238254; 30 anuncios). Alcance: Los Ríos 56 %, Guayas 33 %, Bolívar 4 %, Cotopaxi 3 %. En los datos no aparece ningún otro cliente. Que pague ambas páginas es un hecho de Meta: no prueba que sea la agencia de campaña de nadie ni afiliación.", "dudas": "Sin fuente externa no se puede afirmar que sea una agencia ni quién la dirige; la búsqueda no devolvió ninguna ficha de una agencia con ese nombre. Aparte: la entrada ya registrada «Eduardo Mendoza Palma» (ADN) se apoya en notas d
